# -- Theme Options --
colorScheme: "blowfish"
defaultAppearance: "light"
autoSwitchAppearance: true

enableA11y: false
enableSearch: true
enableCodeCopy: false
enableStructuredBreadcrumbs: false

replyByEmail: false

disableImageOptimization: false
disableImageOptimizationMD: false
disableTextInHeader: false

hotlinkFeatureImage: false
fingerprintAlgorithm: "sha512"

giteaDefaultServer: "https://git.fsfe.org"
forgejoDefaultServer: "https://v11.next.forgejo.org"

header:
  layout: "basic"

footer:
  showMenu: true
  showCopyright: false
  showThemeAttribution: false
  showAppearanceSwitcher: true
  showScrollToTop: true

homepage:
  layout: "background"
  homepageImage: "/backgrounds/gibralter.jpg"
  showRecent: false
  showRecentItems: 5
  showMoreLink: false
  showMoreLinkDest: "/posts/"
  cardView: true
  cardViewScreenWidth: false
  layoutBackgroundBlur: true
  disableHeroImageFilter: false

article:
  showDate: true
  showViews: false
  showLikes: false
  showDateOnlyInArticle: false
  showDateUpdated: true
  showAuthor: false
  showAuthorBottom: true
  showHero: true
  heroStyle: "background"
  layoutBackgroundBlur: true
  layoutBackgroundHeaderSpace: true
  showBreadcrumbs: true
  showDraftLabel: true
  showEdit: false
  editAppendPath: true
  seriesOpened: false
  showHeadingAnchors: true
  showPagination: false
  invertPagination: false
  showReadingTime: true
  showTableOfContents: false
  showTaxonomies: true
  showCategoryOnly: false
  showAuthorsBadges: false
  showWordCount: false
  showZenMode: false

list:
  showHero: true
  heroStyle: "background"
  layoutBackgroundBlur: true
  layoutBackgroundHeaderSpace: false
  showBreadcrumbs: false
  showSummary: true
  showViews: false
  showLikes: false
  showTableOfContents: false
  showCards: false
  orderByWeight: false
  groupByYear: false
  cardView: false
  cardViewScreenWidth: false
  constrainItemsWidth: false

sitemap:
  excludedKinds: ["taxonomy", "term"]

taxonomy:
  showTermCount: true
  showHero: false
  showBreadcrumbs: false
  showViews: false
  showLikes: false
  showTableOfContents: false
  cardView: false

term:
  showHero: false
  showBreadcrumbs: false
  showViews: false
  showLikes: false
  showTableOfContents: true
  groupByYear: false
  cardView: false
  cardViewScreenWidth: false

# Individual analytics and third-party integrations (commented out in TOML)
firebase: {}
fathomAnalytics: {}
umamiAnalytics: {}
selineAnalytics: {}
buymeacoffee: {}
verification: {}
rssnext: {}
advertisement: {}